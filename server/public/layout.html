{{define "head"}}<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0f0c">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
{{- if .Canonical}}
<link rel="canonical" href="{{.Canonical}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:image" content="{{.Origin}}/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PHP2SHELL banner: Is your website exposed to PHP2Shell?">
{{- end}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="PHP2Shell check">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css?v={{.Version}}">
<script src="/static/app.js?v={{.Version}}" defer></script>
{{- with .StructuredData}}
<script type="application/ld+json">{{.}}</script>
{{- end}}
</head>{{end}}

{{define "header"}}<header class="site">
<a class="brand" href="/">PHP2Shell check</a>
<nav><a href="/about">About</a></nav>
</header>{{end}}

{{define "footer"}}<footer class="site">
<p>This service is provided by <a href="{{.ProviderURL}}">{{.Provider}}</a>.</p>
<p><a href="/about">About</a> <span aria-hidden="true">&middot;</span> <a href="{{.SourceURL}}">Source</a> <span aria-hidden="true">&middot;</span> <span class="version">{{.Version}}</span></p>
</footer>{{end}}
